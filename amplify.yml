version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Node $(node -v) / npm $(npm -v)"
        # Wipe install + Next cache so Amplify never reuses a poisoned tree.
        - rm -rf node_modules .next
        - npm ci
        - npx prisma generate
        - node -e "console.log('next=', require('next/package.json').version)"
    build:
      commands:
        # Normalize DB URL for Prisma without writing secrets into source files.
        - |
          if [ -n "$DB_HOST" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASSWORD" ] && [ -n "$DB_NAME" ]; then
            export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?sslmode=${DB_SSLMODE:-require}"
            export DIRECT_URL="$DATABASE_URL"
            echo "Assembled DATABASE_URL from DB_* parts"
          elif [ -n "$DATABASE_URL" ]; then
            export DATABASE_URL="$(printf '%s' "$DATABASE_URL" | sed 's/%26/\&/g')"
            export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}"
            echo "Normalized DATABASE_URL (%26 → &)"
          else
            echo "WARNING: no DATABASE_URL / DB_* parts — migrate may fail"
          fi
        - echo "=== ensure-shipping ==="
        - node scripts/ensure-shipping-settings.cjs
        # Recover P3009 if a prior deploy left fingerprint migration failed (no-op otherwise).
        - echo "=== prisma migrate resolve (failed fingerprint, if any) ==="
        - npx prisma migrate resolve --rolled-back 20260725120000_account_address_fingerprint || true
        - echo "=== prisma migrate deploy ==="
        - npx prisma migrate deploy
        # Node sha256 backfill + merge/unique (Amplify DB role cannot CREATE EXTENSION pgcrypto).
        # ALLOW_ADDRESS_FINGERPRINT_MERGE=1: first cutover merges surplus after logging counts.
        - echo "=== ensure-address-fingerprints ==="
        - ALLOW_ADDRESS_FINGERPRINT_MERGE=1 FAIL_ON_ERROR=1 node scripts/ensure-address-fingerprints.cjs
        # Amplify SSR Lambda often has empty process.env — snapshot build env
        # into a JSON module that Next bundles into the server runtime.
        - echo "=== write amplify runtime env ==="
        - export FORCE_WRITE_AMPLIFY_ENV=1
        - node scripts/write-amplify-runtime-env.cjs
        - echo "=== verify baked env ==="
        - node -e "const f=require('./src/generated/amplify-runtime-env.json');const keys=Object.keys(f);console.log('Baked keys ('+keys.length+'):', keys.join(', '));['JWT_SECRET','ENCRYPTION_KEY','PASSWORD_PEPPER','POW_SECRET'].forEach(k=>{if(!f[k])console.error('MISSING IN BAKED ENV: '+k)});"
        - echo "=== next build ==="
        # Force plain Next config (no Sentry webpack plugin) on Amplify.
        - export AMPLIFY_NEXT_PLAIN_CONFIG=1
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths: []
